<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Render Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        
        .login-container {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
        }
        
        .login-container h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #f0f6fc;
        }
        
        .login-container .subtitle {
            color: #8b949e;
            margin-bottom: 30px;
            font-size: 14px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            font-size: 13px;
            color: #8b949e;
            margin-bottom: 6px;
            font-weight: 500;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px 14px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #238636;
        }
        
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: #238636;
            color: white;
        }
        
        .btn:hover {
            background: #2ea043;
            transform: translateY(-1px);
        }
        
        .error-message {
            color: #f85149;
            font-size: 14px;
            margin-top: 12px;
            display: none;
        }
        
        .logo {
            font-size: 48px;
            text-align: center;
            margin-bottom: 20px;
        }
        
        .register-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #8b949e;
        }
        
        .register-link a {
            color: #58a6ff;
            text-decoration: none;
        }
        
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">🚀</div>
        <h1>Render Clone</h1>
        <p class="subtitle">Вход в панель управления</p>
        
        <div class="form-group">
            <label>Имя пользователя</label>
            <input type="text" id="username" placeholder="admin" value="admin">
        </div>
        
        <div class="form-group">
            <label>Пароль</label>
            <input type="password" id="password" placeholder="••••••••" value="admin123">
        </div>
        
        <button class="btn" onclick="login()">Войти</button>
        
        <div class="error-message" id="errorMessage">Неверный логин или пароль</div>
        
        <div class="register-link">
            Нет аккаунта? <a href="#" onclick="showRegister()">Зарегистрироваться</a>
        </div>
    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMessage');
            
            errorEl.style.display = 'none';
            
            if (!username || !password) {
                errorEl.textContent = 'Введите логин и пароль';
                errorEl.style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    errorEl.textContent = data.error || 'Ошибка входа';
                    errorEl.style.display = 'block';
                    return;
                }
                
                localStorage.setItem('token', data.token);
                window.location.href = '/';
            } catch (error) {
                errorEl.textContent = 'Ошибка соединения с сервером';
                errorEl.style.display = 'block';
            }
        }
        
        function showRegister() {
            alert('Регистрация доступна только администратору.\nОбратитесь к администратору для создания аккаунта.');
        }
        
        // Enter для входа
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                login();
            }
        });
        
        // Проверка токена при загрузке
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }
    </script>
</body>
</html>
