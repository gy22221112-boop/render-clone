<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="refresh" content="0; url=/dashboard.html">
    <title>Render Clone</title>
    <style>
        body {
            background: #0d1117;
            color: #e6edf3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }
        .loader {
            text-align: center;
        }
        .loader .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid #30363d;
            border-top-color: #238636;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>⏳ Перенаправление в панель управления...</p>
    </div>
    <script>
        // Если редирект не сработал
        setTimeout(() => {
            window.location.href = '/dashboard.html';
        }, 1000);
    </script>
</body>
</html>
